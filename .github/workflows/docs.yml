name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'src/rclgd/docs/**'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/rclgd/docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/rclgd/docs/requirements.txt

    - name: Build documentation
      run: |
        sphinx-build -W -b html src/rclgd/docs src/rclgd/docs/_build/html

    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: html-docs
        path: src/rclgd/docs/_build/html
