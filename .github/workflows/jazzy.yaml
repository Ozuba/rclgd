name: jazzy

on:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v4
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.19
      - name: build and test
        id: action_ros_ci
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: rclgd
          target-ros2-distro: jazzy
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jazzy
          path: ${{ steps.action_ros_ci.outputs.ros-workspace-directory-name }}/build/rclgd/test_results
          if-no-files-found: ignore
